[project]
name = "echelon"
version = "0.1.0"
description = "ECHELON Voice Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "faster-whisper>=1.0.0",
    "kokoro>=0.3.4",
    "google-genai>=0.1.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
